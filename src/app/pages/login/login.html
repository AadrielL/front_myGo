<div style="text-align: center; margin-top: 50px;">
  <h2>Login MyGo</h2>
  <form (submit)="onSubmit()">
    <input type="email" [(ngModel)]="email" name="email" placeholder="E-mail" required><br><br>
    <input type="password" [(ngModel)]="password" name="password" placeholder="Senha" required><br><br>
    <button type="submit">Entrar</button>
  </form>
  
  <p style="margin-top: 20px;">
    Não tem conta? <a routerLink="/register">Cadastre-se aqui</a>
  </p>
  
  <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>
</div>
