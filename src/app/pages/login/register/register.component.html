<div style="display: flex; min-height: 100vh; background: var(--bg-main); align-items: center; justify-content: center; padding: 2rem;">
  <div style="width: 100%; max-width: 460px;">
    <!-- Logo -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 48px; height: 48px; background: var(--accent-muted); border: 1px solid rgba(245,158,11,0.3); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--accent-primary); margin: 0 auto 1rem auto;">
        <span class="material-icons" style="font-size: 26px;">bolt</span>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.25rem;">Criar Conta MYGO</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sua calculadora NBR 5410 começa aqui. Plano Grátis disponível.</p>
    </div>

    <div class="app-card">
      <form (submit)="onRegister()">
        <div class="app-form-group">
          <label class="app-label">Nome Completo</label>
          <input type="text" [(ngModel)]="nome" name="nome" placeholder="Ex: João Silva" required class="app-input">
        </div>

        <div class="app-form-group">
          <label class="app-label">E-mail Profissional</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="seu@email.com" required class="app-input">
        </div>

        <div class="app-form-group">
          <label class="app-label">Senha de Acesso</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres" required class="app-input">
        </div>

        <!-- Info do Plano -->
        <div style="padding: 0.85rem; background: var(--accent-muted); border: 1px solid rgba(245,158,11,0.3); border-radius: var(--radius-md); margin-bottom: 1.5rem; display: flex; gap: 0.75rem; align-items: flex-start;">
          <span class="material-icons" style="color: var(--accent-primary); font-size: 20px; margin-top: 1px;">stars</span>
          <div>
            <span class="app-badge app-badge-amber" style="margin-bottom: 0.35rem;">PLANO GRÁTIS</span>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin: 0;">Acesso imediato com <strong style="color: var(--text-main);">3 orçamentos por dia</strong>. Faça upgrade a qualquer momento.</p>
          </div>
        </div>

        <button type="submit" class="app-btn app-btn-primary" style="width: 100%; padding: 0.85rem;">
          <span class="material-icons" style="font-size: 18px;">person_add</span>
          Criar Minha Conta
        </button>
      </form>

      <p *ngIf="errorMessage" style="color: var(--status-danger); margin-top: 1rem; font-size: 0.875rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem;">
        <span class="material-icons" style="font-size: 16px;">error_outline</span>
        {{ errorMessage }}
      </p>

      <div style="margin-top: 1.25rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
        Já tem conta?
        <a routerLink="/login" style="color: var(--accent-primary); font-weight: 700; text-decoration: none; margin-left: 0.25rem;">Fazer Login</a>
      </div>
    </div>
  </div>
</div>
