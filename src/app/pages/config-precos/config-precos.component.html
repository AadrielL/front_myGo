<div class="config-container">
  <div class="config-card">
    <div class="card-header">
      <h3 class="mb-0">Ajuste de Insumos e Mão de Obra</h3>
    </div>
    <div class="card-body">
      <div class="input-group">
        <label>Valor Metro Cabo (2.5mm)</label>
        <input type="number" [(ngModel)]="config.valorMetroCabo25" placeholder="R$ 0,00">
      </div>
      
      <div class="input-group">
        <label>Valor Mão de Obra (por Ponto)</label>
        <input type="number" [(ngModel)]="config.valorPontoEletrico" placeholder="R$ 0,00">
      </div>
      
      <div class="input-group">
        <label>Diária Base Ajudante</label>
        <input type="number" [(ngModel)]="config.diariaAjudante" placeholder="R$ 0,00">
      </div>
      
      <hr class="my-4">
      
      <button class="btn-save" (click)="salvarPrecos()">
        Salvar Novas Configurações
      </button>
    </div>
  </div>
</div>
