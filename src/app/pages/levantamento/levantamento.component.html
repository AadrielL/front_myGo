<div class="dashboard-container">
  <div class="action-card">
    <header class="mb-4">
      <h2>Levantamento por Cômodo: {{ cliente }}</h2>
      <p>O sistema irá calcular a fiação e dispositivos com base nestas quantidades.</p>
    </header>

    <form [formGroup]="levantamentoForm" (ngSubmit)="finalizar()">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Quartos</label>
          <input type="number" formControlName="qtdQuartos" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Salas</label>
          <input type="number" formControlName="qtdSalas" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Cozinhas</label>
          <input type="number" formControlName="qtdCozinhas" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Banheiros</label>
          <input type="number" formControlName="qtdBanheiros" class="form-control">
        </div>
      </div>

      <div class="mt-4">
        <label class="form-label">Observações Técnicas</label>
        <textarea formControlName="observacoestécnicas" class="form-control" rows="3"></textarea>
      </div>

      <div class="mt-4 d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" routerLink="/quiz">Voltar</button>
        <button type="submit" class="btn-reports-primary" [disabled]="levantamentoForm.invalid">
          Gerar Lista de Materiais
        </button>
      </div>
    </form>
  </div>
</div>
