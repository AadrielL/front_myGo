<div class="dashboard-container" style="text-align: center; max-width: 1000px; width: 100%;">
  <!-- Cabeçalho de Boas-vindas -->
  <div class="welcome-section" style="margin-bottom: 3rem; position: relative;">
    <h1 class="title-cartoon">Bem-vindo, <span style="color: var(--wire-blue-dark)">{{ userName }}</span></h1>
    <p style="font-size: 1.2rem; color: var(--text-muted);">Controle central de orçamentos e levantamentos.</p>
    
  </div>

  <!-- Grade de Ações Rápidas -->
  <div class="quick-actions" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem;">
    
    <!-- Card: Novo Orçamento -->
    <div class="cartoon-card" style="cursor: pointer;" (click)="navegar('quiz')">
      <div class="icon-box" style="font-size: 3rem; color: var(--wire-blue-dark); margin-bottom: 1rem;">
        <span class="material-icons" style="font-size: 48px;">add_task</span>
      </div>
      <div class="card-content">
        <h3>Novo Orçamento</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Cálculos precisos NBR 5410.</p>
      </div>
    </div>

    <!-- Card: Histórico -->
    <div class="cartoon-card" style="cursor: pointer;" (click)="navegar('historico')">
      <div class="icon-box" style="font-size: 3rem; color: var(--wire-green-dark); margin-bottom: 1rem;">
        <span class="material-icons" style="font-size: 48px;">history</span>
      </div>
      <div class="card-content">
        <h3>Histórico</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Consulte orçamentos passados.</p>
      </div>
    </div>

    <!-- Card: Levantamento -->
    <div *ngIf="userRole === 'ADMIN'" class="cartoon-card" style="cursor: pointer;" (click)="navegar('levantamento')">
      <div class="icon-box" style="font-size: 3rem; color: var(--wire-orange-dark); margin-bottom: 1rem;">
        <span class="material-icons" style="font-size: 48px;">inventory</span>
      </div>
      <div class="card-content">
        <h3>Levantamento</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Lista técnica de materiais.</p>
      </div>
    </div>

    <!-- Card: Relatórios -->
    <div *ngIf="userRole === 'ADMIN'" class="cartoon-card" style="cursor: pointer;" (click)="navegar('reports')">
      <div class="icon-box" style="font-size: 3rem; color: var(--wire-purple-dark); margin-bottom: 1rem;">
        <span class="material-icons" style="font-size: 48px;">analytics</span>
      </div>
      <div class="card-content">
        <h3>Relatórios</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Visão geral de desempenho.</p>
      </div>
    </div>

  </div>
</div>
