<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="welcome-text">
      <h1>Bem-vindo, {{ userName }}</h1>
      <p>Gerencie seus orçamentos e projetos de forma simplificada.</p>
    </div>
    <button *ngIf="userRole === 'ADMIN'" class="btn-reports-primary" (click)="navegar('reports')">
      <span class="material-icons">analytics</span> Ver Relatórios Admin
    </button>
  </header>

  <div class="quick-actions">
    <div class="action-card" (click)="navegar('quiz')">
      <div class="icon-box blue"><span class="material-icons">add_task</span></div>
      <h3>Novo Orçamento</h3>
      <p>Inicie um dimensionamento baseado na NBR 5410.</p>
    </div>

    <div class="action-card" (click)="navegar('historico')">
      <div class="icon-box green"><span class="material-icons">history</span></div>
      <h3>Histórico</h3>
      <p>Consulte orçamentos e cálculos anteriores.</p>
    </div>

    <div *ngIf="userRole === 'ADMIN'" class="action-card" (click)="navegar('levantamento')">
      <div class="icon-box orange"><span class="material-icons">inventory</span></div>
      <h3>Levantamento de Materiais</h3>
      <p>Gere a lista técnica para o cliente.</p>
    </div>
  </div>
</div>
