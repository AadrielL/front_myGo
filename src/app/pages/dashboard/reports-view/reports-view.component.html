<section class="reports-container">
  <div class="flex-header">
    <h2 class="section-title">Desempenho e Relatórios</h2>
    <button class="refresh-circle" (click)="carregarDados()" [class.active]="loading">
      <span class="material-icons">refresh</span>
    </button>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Sincronizando com o servidor...</p>
  </div>

  <div class="stats-container" *ngIf="!loading && stats">
    <div class="kpi-row">
      <div class="kpi-card">
        <small>Total Orçamentos</small>
        <h3>{{ stats.totalOrcamentos }}</h3>
      </div>
      <div class="kpi-card">
        <small>Taxa de Conversão</small>
        <h3>{{ stats.taxaConversao | number:'1.0-0' }}%</h3>
      </div>
    </div>

    <div class="chart-box">
      <h3>Distribuição de Status</h3>
      <div class="progress-stack">
        <div class="bar-label">Aceitos ({{ stats.statusCount['ACEITO'] || 0 }})</div>
        <div class="progress-bg">
          <div class="progress-fill green" [style.width.%]="(stats.statusCount['ACEITO'] / stats.totalOrcamentos) * 100 || 0"></div>
        </div>
      </div>
    </div>
  </div>
</section>
