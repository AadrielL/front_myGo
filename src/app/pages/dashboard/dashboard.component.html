<div class="dashboard-layout">
  <!-- Sidebar flutuante no canto esquerdo -->
  <app-sidebar></app-sidebar>

  <!-- O 'collapsed' aqui controla o recuo da margem esquerda -->
  <main class="main-content">
    
    <!-- TOPBAR GLOBAL -->
    <div class="global-topbar" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; width: 100%; box-sizing: border-box; z-index: 100; background: var(--bg-main);">
      <!-- Lado Esquerdo: Botão Sair -->
      <button class="btn-topbar btn-sair" (click)="logout()" style="display: flex; align-items: center; gap: 8px; background: transparent; border: 2px solid var(--wire-pink-dark); color: var(--wire-pink-dark); font-weight: bold; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: all 0.2s;">
        <span class="material-icons" style="font-size: 1.2rem;">logout</span>
        Sair
      </button>

      <!-- Lado Direito: Botão Assinatura -->
      <button class="btn-topbar btn-pro" (click)="irParaAssinatura()" style="display: flex; align-items: center; gap: 8px; background: var(--wire-green-dark); color: white; font-weight: bold; padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0, 168, 107, 0.3);">
        <span class="material-icons" style="font-size: 1.2rem;">stars</span>
        Assinatura PRO
      </button>
    </div>

    <!-- ÁREA DE CONTEÚDO (flex: 1 para ocupar o resto do espaço, padding para espaçar) -->
    <div class="page-container" style="flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; box-sizing: border-box;">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
